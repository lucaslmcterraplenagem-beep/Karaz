<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LK Pneus</title>
        <script>
        // Evita o flash de tema na troca de páginas
        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen font-sans">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-orange-500">LK <span class="text-white">Pneus</span></h1>
            <p class="text-gray-400 text-sm mt-2">Gestão de Frota e Pneus</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500 text-red-500 text-sm p-3 rounded-md text-center"></div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
            </div>
            <button type="submit" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 shadow-lg shadow-orange-600/30">
                Acessar Sistema
            </button>
        </form>
        <div class="mt-6 text-center text-xs text-gray-500">
            &copy; 2026 LK Pneus. Sistema Seguro.
        </div>
    </div>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
