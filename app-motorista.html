<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aferição de Pneus | Karaz</title>
    
    <!-- PWA META TAGS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo-app.png">
    <link rel="icon" type="image/png" href="logo.png">

    <script>
        if (localStorage.theme === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#ea580c', darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
            <!-- MODAL DE CONFIRMAÇÃO DE SAÍDA -->
    <div id="modal-sair" class="hidden fixed inset-0 bg-black/70 z-[200] flex items-center justify-center p-6 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-2xl w-full max-w-sm border border-gray-200 dark:border-slate-700 p-6 text-center transform scale-95 transition-transform duration-300" id="modal-sair-content">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="log-out" class="w-8 h-8 text-red-500"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Sair do App?</h3>
            <p class="text-sm text-gray-500 mb-6">Você precisará digitar seu CPF e senha novamente para entrar.</p>
            
            <div class="flex gap-3 w-full">
                <button onclick="fecharModalSair()" class="flex-1 py-3 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 font-bold rounded-xl transition-colors">Cancelar</button>
                <button onclick="fazerLogout()" class="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-500/30 transition-colors">Sim, Sair</button>
            </div>
        </div>
    </div>
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-[100dvh] flex flex-col overflow-hidden antialiased">

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="absolute inset-0 z-50 bg-gray-100 dark:bg-darkbg flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <img src="logo.png" alt="Logo Karaz" class="w-24 h-24 mx-auto mb-4 object-contain rounded-3xl shadow-xl shadow-brand/20">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Aferição de Pneus</h1>
                <p class="text-gray-500 mt-1">Acesso do Motorista</p>
            </div>
            
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">CPF (Somente números)</label>
                    <input type="text" id="login-email" required class="w-full p-3 bg-white dark:bg-darkcard border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base" placeholder="Ex: 12345678900">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Senha / PIN</label>
                    <input type="password" id="login-senha" required class="w-full p-3 bg-white dark:bg-darkcard border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base" placeholder="••••">
                </div>
                <div id="login-erro" class="hidden text-red-500 text-sm bg-red-500/10 p-3 rounded-lg text-center"></div>
                <button type="submit" id="btn-login" class="w-full bg-brand hover:bg-orange-700 text-white font-bold py-3 rounded-lg shadow-lg transition-colors">Entrar</button>
            </form>
        </div>
    </div>

    <!-- CABEÇALHO ATUALIZADO -->
    <header class="bg-white dark:bg-darkcard border-b border-gray-200 dark:border-slate-700 p-4 flex justify-between items-center shrink-0 z-20 relative">
        <div class="flex items-center gap-3">
            <!-- Logo Nova -->
            <img src="logo.png" alt="Karaz" class="h-10 w-auto object-contain">
            <div>
                <h1 class="text-base font-bold text-gray-900 dark:text-white leading-tight">Aferição de Pneus</h1>
                <p id="nome-motorista-header" class="text-xs text-gray-500">...</p>
            </div>
        </div>
        
        <!-- Botão de Configuração (Só aparece na tela inicial) -->
        <button id="btn-config" onclick="abrirMenuConfig()" class="text-gray-500 hover:text-brand p-2 transition-colors">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- MENU DE CONFIGURAÇÕES (OVERLAY) -->
    <div id="menu-config" class="hidden fixed inset-0 bg-black/60 z-[100] backdrop-blur-sm transition-opacity" onclick="fecharMenuConfig()"></div>
    <div id="painel-config" class="fixed top-0 right-0 h-full w-72 bg-white dark:bg-darkcard shadow-2xl z-[101] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-800/30">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">Configurações</h3>
            <button onclick="fecharMenuConfig()" class="text-gray-400 hover:text-red-500"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        
        <div class="p-6 flex-1 flex flex-col gap-6">
            <!-- Informações da Conta -->
            <div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Conta Logada</p>
                <div class="bg-gray-50 dark:bg-slate-800 p-3 rounded-lg border border-gray-200 dark:border-slate-700 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-brand/10 flex items-center justify-center text-brand">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p id="config-nome" class="text-sm font-bold text-gray-900 dark:text-white truncate">...</p>
                        <p id="config-email" class="text-xs text-gray-500 truncate">...</p>
                    </div>
                </div>
            </div>

            <!-- Tema -->
            <div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Aparência</p>
                <button onclick="toggleTema()" class="w-full flex items-center justify-between p-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg hover:border-brand transition-colors">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Mudar Tema (Claro/Escuro)</span>
                    <div class="flex items-center gap-2">
                        <i data-lucide="sun" class="w-4 h-4 text-yellow-500 dark:hidden"></i>
                        <i data-lucide="moon" class="w-4 h-4 text-blue-400 hidden dark:block"></i>
                    </div>
                </button>
            </div>

            <!-- Sair -->
            <div class="mt-auto">
                <button onclick="confirmarSair()" class="w-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white p-3 rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Sair do App
                </button>
            </div>
        </div>

              <!-- Versão do App -->
        <div class="p-4 border-t border-gray-200 dark:border-slate-700 text-center">
            <p id="app-versao" class="text-xs text-gray-400 font-mono">Carregando versão...</p>
        </div>
        
    <!-- ÁREA DE CONTEÚDO ROLÁVEL -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 relative">
        
        <!-- TELA 1: LISTA DE VEÍCULOS -->
        <div id="tela-veiculos" class="hidden">
            <div class="mb-4">
                <div class="relative">
                    <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="busca-veiculo" placeholder="Buscar por placa, prefixo..." 
                        class="w-full pl-10 pr-4 py-3 bg-white dark:bg-darkcard border border-gray-300 dark:border-slate-600 rounded-xl text-base focus:outline-none focus:border-brand shadow-sm">
                </div>
            </div>
            <div id="lista-veiculos" class="space-y-3"></div>
        </div>

        <!-- TELA 2: DETALHES DO VEÍCULO E LISTA DE PNEUS -->
        <div id="tela-pneus" class="hidden">
            <button onclick="voltarParaVeiculos()" class="flex items-center gap-1 text-sm font-medium text-brand mb-4 p-2 -ml-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar para Veículos
            </button>

            <div class="bg-white dark:bg-darkcard p-4 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm mb-6 flex items-center gap-4">
                <div class="inline-flex flex-col border-2 border-gray-900 dark:border-white rounded-md overflow-hidden w-20 shadow-sm shrink-0">
                    <div class="bg-[#003399] text-white text-[7px] text-center font-bold py-0.5 tracking-widest">BRASIL</div>
                    <div id="placa-visual" class="bg-white text-black text-center font-bold text-sm leading-none py-1 uppercase">...</div>
                </div>
                <div>
                    <h2 id="modelo-visual" class="font-bold text-lg leading-tight text-gray-900 dark:text-white">...</h2>
                    <p id="prefixo-visual" class="text-sm text-gray-500 font-medium">...</p>
                </div>
            </div>

            <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Selecione o Pneu</h3>
            
            <div class="relative bg-slate-100 dark:bg-slate-900 rounded-3xl p-4 pt-8 pb-8 flex flex-col items-center w-full max-w-sm mx-auto shadow-inner border border-gray-200 dark:border-slate-700">
                <!-- Cabine (Frente) -->
                <div class="w-40 h-12 bg-slate-300 dark:bg-slate-700 rounded-t-xl border-4 border-b-0 border-slate-400 dark:border-slate-500 flex items-center justify-center mb-8 relative z-10 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Frente</span>
                </div>

                <!-- Container dos Eixos -->
                <div class="relative w-full flex flex-col items-center pb-6 z-0">
                    <div class="absolute top-0 bottom-0 left-1/2 w-3 bg-slate-400 dark:bg-slate-500 -translate-x-1/2 z-0 rounded-b-xl"></div>
                    <div id="lista-pneus" class="w-full flex flex-col gap-8 relative z-10"></div>
                </div>

                <!-- Container dos Estepes -->
                <div id="container-estepes" class="w-full mt-4 pt-6 border-t-2 border-slate-300 dark:border-slate-700 border-dashed flex flex-col items-center relative z-10 hidden">
                </div>
            </div>
        </div>
    </main>

    <!-- GAVETA DE AFERIÇÃO (BOTTOM SHEET) -->
    <div id="overlay-gaveta" class="hidden fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" onclick="fecharGaveta()"></div>
    <div id="gaveta-afericao" class="fixed bottom-0 left-0 right-0 bg-white dark:bg-darkcard rounded-t-2xl shadow-2xl border-t border-gray-200 dark:border-slate-700 z-50 transform translate-y-full transition-transform duration-300 flex flex-col max-h-[90vh]">
        
        <div class="p-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center">
            <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Aferição</h3>
                <p id="gaveta-pneu-info" class="text-sm text-brand font-medium">...</p>
            </div>
            <button onclick="fecharGaveta()" class="p-2 text-gray-400 hover:text-red-500 bg-gray-100 dark:bg-slate-800 rounded-full">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="p-4 overflow-y-auto space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">O que você vai fazer? <span class="text-red-500">*</span></label>
                <select id="input-acao" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base" onchange="ajustarCamposAcao()">
                    <option value="calibragem">Calibrar (Pressão)</option>
                    <option value="sulco">Medir Sulco</option>
                    <option value="observacao">Somente Observação</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">KM ou Horas Atual <span id="obrigatorio-km" class="text-red-500">*</span></label>
                <input type="number" id="input-km" placeholder="Ex: 150000" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base">
            </div>

            <div class="grid grid-cols-2 gap-3" id="campos-tecnicos">
                <div id="div-pressao">
                    <label class="block text-sm font-medium mb-1 text-brand">Pressão (PSI)</label>
                    <input type="number" id="input-pressao" placeholder="Ex: 110" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base">
                </div>
                <div id="div-sulco">
                    <label class="block text-sm font-medium mb-1">Sulco (mm)</label>
                    <input type="number" step="0.1" id="input-sulco" placeholder="Ex: 12.5" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base">
                    <p class="text-[10px] text-gray-500 mt-1 leading-tight">*Medição realizada com paquímetro específico.</p>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Observação (Opcional)</label>
                <textarea id="input-obs" rows="2" placeholder="Ex: Pneu com prego..." class="w-full p-3 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg focus:border-brand text-base"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Anexar Foto (Opcional)</label>
                <input type="file" id="input-foto" accept="image/*" capture="environment" class="w-full p-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand/10 file:text-brand hover:file:bg-brand/20">
            </div>

            <button onclick="salvarAfericaoDireto()" id="btn-salvar-afericao" class="w-full mt-4 bg-brand hover:bg-orange-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg">
                Salvar Aferição
            </button>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        lucide.createIcons();
        
        let veiculos = [];
        let veiculoSelecionado = null;
        let pneuSelecionado = null;
        let dadosMotoristaLogado = null;

        // --- LÓGICA DE LOGIN ---
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (session) await iniciarApp(session);
        });

        async function iniciarApp(session) {
            const { data: motorista } = await supabaseClient.from('motoristas').select('nome').eq('user_id', session.user.id).single();
            dadosMotoristaLogado = { nome: motorista ? motorista.nome : session.user.email, email: session.user.email };
            
            document.getElementById('nome-motorista-header').innerText = dadosMotoristaLogado.nome;
            document.getElementById('config-nome').innerText = dadosMotoristaLogado.nome;
            document.getElementById('config-email').innerText = dadosMotoristaLogado.email;
            
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-veiculos').classList.remove('hidden');
            carregarVeiculos();
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            let email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const btn = document.getElementById('btn-login');
            const erroDiv = document.getElementById('login-erro');

            btn.innerHTML = 'Entrando...'; btn.disabled = true; erroDiv.classList.add('hidden');

            if (email.length === 11 && /^\d+$/.test(email)) email = email + '@colaborador.karaz.com';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

            if (error) {
                erroDiv.innerText = "CPF ou senha incorretos.";
                erroDiv.classList.remove('hidden');
                btn.innerHTML = 'Entrar'; btn.disabled = false;
            } else {
                await iniciarApp(data.session);
            }
        });

        // --- MENU DE CONFIGURAÇÕES ---
        function abrirMenuConfig() {
            document.getElementById('menu-config').classList.remove('hidden');
            document.getElementById('painel-config').classList.remove('translate-x-full');
        }

        function fecharMenuConfig() {
            document.getElementById('painel-config').classList.add('translate-x-full');
            setTimeout(() => { document.getElementById('menu-config').classList.add('hidden'); }, 300);
        }

        function toggleTema() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

                function confirmarSair() {
            document.getElementById('modal-sair').classList.remove('hidden');
            // Pequena animação para o modal crescer na tela
            setTimeout(() => {
                document.getElementById('modal-sair-content').classList.remove('scale-95');
                document.getElementById('modal-sair-content').classList.add('scale-100');
            }, 10);
        }

        function fecharModalSair() {
            document.getElementById('modal-sair-content').classList.remove('scale-100');
            document.getElementById('modal-sair-content').classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('modal-sair').classList.add('hidden');
            }, 200);
        }

        async function fazerLogout() { 
            await supabaseClient.auth.signOut(); 
            window.location.reload(); 
        }

        async function fazerLogout() { 
            await supabaseClient.auth.signOut(); 
            window.location.reload(); 
        }

        // --- LÓGICA DE VEÍCULOS ---
        async function carregarVeiculos() {
            const { data, error } = await supabaseClient.from('veiculos').select('*').eq('ativo', true).order('placa');
            if (error) return console.error(error);
            veiculos = data || [];
            renderizarListaVeiculos(veiculos);
        }

        function renderizarListaVeiculos(lista) {
            const container = document.getElementById('lista-veiculos');
            container.innerHTML = '';
            if(lista.length === 0) return container.innerHTML = '<p class="text-center text-gray-500 py-4">Nenhum veículo encontrado.</p>';

            lista.forEach(v => {
                container.innerHTML += `
                    <div onclick="selecionarVeiculo('${v.id}')" class="bg-white dark:bg-darkcard p-4 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-800 flex items-center justify-center"><i data-lucide="truck" class="w-5 h-5 text-gray-500"></i></div>
                            <div>
                                <div class="font-bold text-lg text-gray-900 dark:text-white uppercase">${v.placa}</div>
                                <div class="text-sm text-gray-500">${v.prefixo || 'S/ Prefixo'} • ${v.modelo}</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        document.getElementById('busca-veiculo').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            renderizarListaVeiculos(veiculos.filter(v => v.placa.toLowerCase().includes(termo) || (v.prefixo && v.prefixo.toLowerCase().includes(termo)) || v.modelo.toLowerCase().includes(termo)));
        });

        // --- LÓGICA DE PNEUS ---
        async function selecionarVeiculo(id) {
            veiculoSelecionado = veiculos.find(v => v.id === id);
            if(!veiculoSelecionado) return;

            // ESCONDE O BOTÃO DE CONFIGURAÇÃO AO ENTRAR NO MAPA
            document.getElementById('btn-config').classList.add('hidden');

            document.getElementById('tela-veiculos').classList.add('hidden');
            document.getElementById('tela-pneus').classList.remove('hidden');

            document.getElementById('placa-visual').innerText = veiculoSelecionado.placa;
            document.getElementById('modelo-visual').innerText = veiculoSelecionado.modelo;
            document.getElementById('prefixo-visual').innerText = veiculoSelecionado.prefixo || 'S/ Prefixo';

            const { data: pneus, error } = await supabaseClient.from('pneus').select('*').eq('veiculo_id', id).eq('status', 'em_uso');
            if (error) return console.error(error);

            renderizarListaPneus(pneus || []);
        }

        function renderizarListaPneus(pneus) {
            const container = document.getElementById('lista-pneus');
            const containerEstepes = document.getElementById('container-estepes');
            container.innerHTML = '';
            containerEstepes.innerHTML = '';
            containerEstepes.classList.add('hidden');
            
            let configArr = veiculoSelecionado.configuracao_eixos ? veiculoSelecionado.configuracao_eixos.split(',') : [2, 4, 4, 2];
            let estepes = veiculoSelecionado.quantidade_estepes || 0;

            configArr.forEach((qtdStr, indexEixo) => {
                let qtd = parseInt(qtdStr);
                let eixoDiv = document.createElement('div');
                eixoDiv.className = "relative flex justify-between items-center w-full px-2";
                
                eixoDiv.innerHTML = `<div class="absolute top-1/2 left-0 w-full h-3 bg-slate-400 dark:bg-slate-500 -translate-y-1/2 rounded-full z-0"></div>`;

                let pneusPorLado = qtd / 2;
                let ladoEsquerdoHtml = '<div class="flex gap-2 z-10">';
                let ladoDireitoHtml = '<div class="flex gap-2 z-10">';

                for (let i = 1; i <= pneusPorLado; i++) {
                    let labelPosicao = "";
                    if (pneusPorLado === 1) labelPosicao = "Unico";
                    else if (pneusPorLado === 2) labelPosicao = i === 1 ? "Ext" : "Int";
                    else labelPosicao = `${i}º`;

                    const posEsq = `E${indexEixo+1}-E${i}`;
                    const pneuEsq = pneus.find(p => p.posicao === posEsq);
                    ladoEsquerdoHtml += criarBotaoPneuApp(pneuEsq, posEsq, labelPosicao, 'Esq');
                    
                    const posDir = `E${indexEixo+1}-D${i}`;
                    const pneuDir = pneus.find(p => p.posicao === posDir);
                    ladoDireitoHtml += criarBotaoPneuApp(pneuDir, posDir, labelPosicao, 'Dir');
                }
                
                ladoEsquerdoHtml += '</div>';
                ladoDireitoHtml += '</div>';

                eixoDiv.innerHTML += `${ladoEsquerdoHtml}<div class="w-8"></div>${ladoDireitoHtml}`;
                container.appendChild(eixoDiv);
            });

            if (estepes > 0) {
                containerEstepes.classList.remove('hidden');
                let htmlEstepes = '';
                for (let i = 1; i <= estepes; i++) {
                    const posicao = `ESTEPE-${i}`;
                    const pneu = pneus.find(p => p.posicao === posicao);
                    htmlEstepes += criarBotaoPneuApp(pneu, posicao, '', 'Est'); 
                }
                
                containerEstepes.innerHTML = `
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Estepes</p>
                    <div class="flex justify-center gap-4">${htmlEstepes}</div>
                `;
            }
            lucide.createIcons();
        }

        function criarBotaoPneuApp(pneu, posicao, labelPosicao, lado) {
            if(pneu) {
                let sulco = pneu.sulco_atual !== null ? pneu.sulco_atual : pneu.sulco_inicial;
                let cor = 'bg-green-500 border-green-600';
                if (sulco <= 5) cor = 'bg-yellow-500 border-yellow-600';
                if (sulco <= 3) cor = 'bg-red-500 border-red-600';

                return `
                    <button onclick="abrirGaveta('${pneu.id}', '${pneu.numero_fogo}', '${posicao}')" 
                        class="${cor} text-white p-2 rounded-full font-bold flex flex-col items-center justify-center shadow-md active:scale-95 transition-transform w-12 h-20">
                        <span class="text-[9px] font-normal opacity-90 leading-tight">${lado} ${labelPosicao !== 'Unico' ? labelPosicao : ''}</span>
                        <span class="text-sm mt-1">${pneu.numero_fogo}</span>
                    </button>
                `;
            } else {
                return `
                    <div class="bg-gray-100 dark:bg-slate-800 border-2 border-dashed border-gray-300 dark:border-slate-600 text-gray-400 p-2 rounded-full flex items-center justify-center w-12 h-20">
                        <i data-lucide="minus" class="w-5 h-5"></i>
                    </div>
                `;
            }
        }

        function voltarParaVeiculos() {
            document.getElementById('tela-pneus').classList.add('hidden');
            document.getElementById('tela-veiculos').classList.remove('hidden');
            veiculoSelecionado = null;

            // MOSTRA O BOTÃO DE CONFIGURAÇÃO NOVAMENTE AO VOLTAR PARA O INÍCIO
            document.getElementById('btn-config').classList.remove('hidden');
        }

        // --- GAVETA E AFERIÇÃO ---
        function abrirGaveta(pneuId, numeroFogo, posicao) {
            pneuSelecionado = { id: pneuId, numeroFogo: numeroFogo, posicao: posicao };
            document.getElementById('gaveta-pneu-info').innerText = `Pneu: ${numeroFogo} | Posição: ${posicao}`;
            document.getElementById('input-km').value = '';
            document.getElementById('input-pressao').value = '';
            document.getElementById('input-sulco').value = '';
            document.getElementById('input-obs').value = '';
            document.getElementById('input-foto').value = '';
            document.getElementById('input-acao').value = 'calibragem';
            
            ajustarCamposAcao();

            document.getElementById('overlay-gaveta').classList.remove('hidden');
            document.getElementById('gaveta-afericao').classList.remove('translate-y-full');
        }

        function ajustarCamposAcao() {
            const acao = document.getElementById('input-acao').value;
            const camposTecnicos = document.getElementById('campos-tecnicos');
            const divPressao = document.getElementById('div-pressao');
            const divSulco = document.getElementById('div-sulco');
            const obrigatorioKm = document.getElementById('obrigatorio-km');

            if (acao === 'observacao') {
                camposTecnicos.classList.add('hidden'); 
                obrigatorioKm.classList.add('hidden'); 
            } else if (acao === 'sulco') {
                camposTecnicos.classList.remove('hidden');
                divPressao.classList.add('hidden');
                divSulco.classList.remove('hidden');
                obrigatorioKm.classList.remove('hidden');
            } else {
                camposTecnicos.classList.remove('hidden');
                divPressao.classList.remove('hidden');
                divSulco.classList.remove('hidden');
                obrigatorioKm.classList.remove('hidden');
            }
        }

        function fecharGaveta() {
            document.getElementById('overlay-gaveta').classList.add('hidden');
            document.getElementById('gaveta-afericao').classList.add('translate-y-full');
        }

        async function salvarAfericaoDireto() {
            const btn = document.getElementById('btn-salvar-afericao');
            const acao = document.getElementById('input-acao').value;
            const kmInput = document.getElementById('input-km').value;
            
            if(acao !== 'observacao' && !kmInput) {
                return alert("Por favor, preencha o KM/Horas atual.");
            }

            btn.innerHTML = 'Salvando...'; btn.disabled = true;

            const km = kmInput ? parseFloat(kmInput) : null;
            const pressao = (acao === 'calibragem') ? parseFloat(document.getElementById('input-pressao').value) : null;
            const sulco = (acao === 'calibragem' || acao === 'sulco') ? parseFloat(document.getElementById('input-sulco').value) : null;
            const obs = document.getElementById('input-obs').value;
            
            let fotoUrl = null;
            const fileInput = document.getElementById('input-foto');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileName = `${Date.now()}_${pneuSelecionado.numeroFogo}.jpg`;
                const { error: uploadError } = await supabaseClient.storage.from('fotos-pneus').upload(fileName, file);
                if(!uploadError) {
                    fotoUrl = fileName; 
                } else {
                    alert("Aviso: A foto não pôde ser enviada, mas a aferição será salva.");
                }
            }

            const { error } = await supabaseClient.rpc('registrar_afericao_app', {
                p_veiculo_id: veiculoSelecionado.id,
                p_pneu_id: pneuSelecionado.id,
                p_km: km,
                p_sulco: sulco,
                p_pressao: pressao,
                p_observacao: obs,
                p_foto_url: fotoUrl,
                p_tipo_acao: acao
            });

            if (error) {
                alert("Erro ao salvar: " + error.message);
                btn.innerHTML = 'Salvar Aferição'; btn.disabled = false;
            } else {
                alert("✅ Aferição registrada com sucesso!");
                fecharGaveta();
                btn.innerHTML = 'Salvar Aferição'; btn.disabled = false;
                selecionarVeiculo(veiculoSelecionado.id);
            }
        }
                        // BUSCAR A VERSÃO REAL DIRETO DO GITHUB
        async function carregarVersaoApp() {
            try {
                // Faz uma requisição para a API pública do GitHub
                const response = await fetch('https://api.github.com/repos/lucaslmcterraplenagem-beep/Karaz/commits/main');
                const data = await response.json();
                
                // Pega os 7 primeiros caracteres do hash
                const versaoHash = data.sha.substring(0, 7);
                const dataCommit = new Date(data.commit.author.date).toLocaleDateString('pt-BR');
                
                document.getElementById('app-versao').innerText = `Karaz App v${versaoHash} (${dataCommit})`;
            } catch (error) {
                console.log("Erro ao buscar versão no GitHub:", error);
                document.getElementById('app-versao').innerText = "Karaz App (Versão Offline)";
            }
        }
        
        // Chama a função assim que a página carrega
        carregarVersaoApp();    
                
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    
                  
                    setInterval(() => { registration.update(); }, 30000);

                  
                    let refreshing;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (refreshing) return;
                        window.location.reload();
                        refreshing = true;
                    });
                }).catch(err => console.log('Erro no PWA:', err));
            });
        }
       
    </script>
</body>
</html>
