<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço | Karaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#ea580c', darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-screen flex overflow-hidden transition-colors duration-300 antialiased">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-slate-700 transition-all duration-300 flex flex-col z-20">
        <div>
            <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">Karaz <span class="text-brand">Sistema</span></h1>
            </div>
            <nav class="p-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="menu-text text-sm">Dashboard</span>
                </a>
                <a href="veiculos.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="truck" class="w-5 h-5"></i><span class="menu-text text-sm">Veículos</span>
                </a>
                <a href="pneus.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="disc" class="w-5 h-5"></i><span class="menu-text text-sm">Pneus</span>
                </a>
                <!-- Menu Ativo -->
                <a href="ordens-servico.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand/10 text-brand rounded-md font-medium transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i><span class="menu-text text-sm">Ordens de Serviço</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-6 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors rounded-md"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">Gestão de OS</h2>
            </div>
            <div class="flex items-center gap-5">
                <button id="toggle-theme" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i><i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
                <div class="h-5 w-px bg-gray-300 dark:bg-slate-700"></div>
                <div class="flex items-center gap-3">
                    <p id="user-email" class="text-sm font-medium text-gray-800 dark:text-gray-200 hidden sm:block">...</p>
                    <button id="btn-logout" class="p-2 text-gray-400 hover:text-red-500 transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-darkbg">
            
            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white dark:bg-darkcard p-4 rounded-lg border border-gray-200 dark:border-slate-700">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">OS Abertas / Andamento</p>
                    <p class="text-2xl font-bold text-blue-500" id="kpi-abertas">0</p>
                </div>
                <div class="bg-white dark:bg-darkcard p-4 rounded-lg border border-gray-200 dark:border-slate-700">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Custo Total (Filtro Atual)</p>
                    <p class="text-2xl font-bold text-gray-900 dark:text-white" id="kpi-custo">R$ 0,00</p>
                </div>
                <div class="bg-white dark:bg-darkcard p-4 rounded-lg border border-gray-200 dark:border-slate-700">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Total de OS no Filtro</p>
                    <p class="text-2xl font-bold text-gray-900 dark:text-white" id="kpi-total">0</p>
                </div>
            </div>

            <!-- FILTROS E AÇÕES -->
            <div class="bg-white dark:bg-darkcard p-4 rounded-lg border border-gray-200 dark:border-slate-700 mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex flex-wrap w-full gap-3 items-center">
                    <!-- Busca por OS -->
                    <div class="relative w-full sm:w-64">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="busca-os" placeholder="Buscar por Nº OS..." class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:border-brand transition-colors">
                    </div>
                    <!-- Filtro de Data -->
                    <div class="flex items-center gap-2">
                        <input type="date" id="data-inicio" class="px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:border-brand text-gray-600 dark:text-gray-300">
                        <span class="text-gray-400 text-sm">até</span>
                        <input type="date" id="data-fim" class="px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:border-brand text-gray-600 dark:text-gray-300">
                    </div>
                </div>
                
                <button onclick="abrirModal()" class="w-full md:w-auto whitespace-nowrap bg-brand hover:bg-orange-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova OS
                </button>
            </div>

            <!-- TABELA -->
            <div class="bg-white dark:bg-darkcard border border-gray-200 dark:border-slate-700 rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-slate-800/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Nº OS / Data</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Veículo</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Tipo / Descrição</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Status / Custo</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-os" class="text-sm divide-y divide-gray-200 dark:divide-slate-700"></tbody>
                </table>
                <div id="aviso-vazio" class="p-8 text-center text-gray-500 dark:text-gray-400 text-sm hidden">Nenhuma OS encontrada com estes filtros.</div>
            </div>
        </main>
    </div>

    <!-- MODAL NOVA OS (DINÂMICO) -->
    <div id="modal-os" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-darkcard rounded-xl shadow-2xl w-full max-w-2xl border border-gray-200 dark:border-slate-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-brand">Abrir Nova OS</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="form-os" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Veículo <span class="text-red-500">*</span></label>
                        <select id="veiculo_id" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                            <option value="">Selecione o veículo...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Tipo de Serviço <span class="text-red-500">*</span></label>
                        <select id="tipo" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                            <option value="">Selecione...</option>
                            <option value="pneu">Troca/Reparo de Pneu</option>
                            <option value="calibragem">Calibragem</option>
                            <option value="preventiva">Preventiva</option>
                            <option value="corretiva">Corretiva</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">KM Atual <span class="text-red-500">*</span></label>
                        <input type="number" id="km_abertura" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                    </div>
                    <div id="div-custo" class="hidden">
                        <label class="block text-sm font-medium mb-1">Custo Estimado (R$) <i data-lucide="lock" class="w-3 h-3 inline text-gray-400"></i></label>
                        <input type="number" step="0.01" id="custo" class="w-full px-3 py-2 bg-gray-100 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand disabled:opacity-50 disabled:cursor-not-allowed" placeholder="Apenas Admin edita">
                    </div>
                </div>

                <!-- ÁREA DINÂMICA (Muda conforme o tipo) -->
                <div id="area-dinamica" class="bg-gray-50 dark:bg-slate-800/50 p-4 rounded-lg border border-gray-200 dark:border-slate-700 hidden">
                    <!-- Preenchido via JS -->
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-gray-200 dark:border-slate-700">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-md transition-colors">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="px-4 py-2 text-sm font-medium text-white bg-brand hover:bg-orange-700 rounded-md transition-colors">Criar OS</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        lucide.createIcons();

        // --- UI LÓGICA ---
        let userRole = 'admin'; // Fallback, vamos tentar pegar do JWT
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) { window.location.href = "login.html"; } 
            else { 
                document.getElementById('user-email').innerText = session.user.email; 
                // Decodifica o JWT para pegar a role
                try {
                    const payload = JSON.parse(atob(session.access_token.split('.')[1]));
                    if(payload.user_role) userRole = payload.user_role;
                } catch(e) {}
                
                // Trava de custo
                if (userRole !== 'admin') {
                    document.getElementById('custo').disabled = true;
                } else {
                    document.getElementById('div-custo').querySelector('i').classList.add('hidden'); // Esconde o cadeado se for admin
                }
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut(); window.location.href = "login.html";
        });

        const sidebar = document.getElementById('sidebar');
        const menuTexts = document.querySelectorAll('.menu-text');
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-20'); menuTexts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.replace('w-20', 'w-64'); menuTexts.forEach(el => el.classList.remove('hidden'));
            }
        });

        const html = document.documentElement;
        if (localStorage.theme === 'light') html.classList.remove('dark');
        document.getElementById('toggle-theme').addEventListener('click', () => {
            html.classList.toggle('dark'); localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- LÓGICA DE DADOS ---
        let todasOS = [];
        let listaVeiculos = [];
        const tabela = document.getElementById('tabela-os');
        const avisoVazio = document.getElementById('aviso-vazio');
        const formatarDinheiro = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        const urlParams = new URLSearchParams(window.location.search);
        const veiculoIdParam = urlParams.get('veiculo_id');

        async function carregarDados() {
            const { data: veiculos } = await supabaseClient.from('veiculos').select('id, placa, modelo, km_atual').order('placa');
            listaVeiculos = veiculos || [];
            
            const selectVeiculo = document.getElementById('veiculo_id');
            selectVeiculo.innerHTML = '<option value="">Selecione o veículo...</option>';
            listaVeiculos.forEach(v => {
                selectVeiculo.innerHTML += `<option value="${v.id}" data-km="${v.km_atual}">${v.placa} - ${v.modelo}</option>`;
            });

            // Auto preenche KM se o carro for selecionado
            selectVeiculo.addEventListener('change', (e) => {
                const opt = e.target.options[e.target.selectedIndex];
                if(opt.dataset.km) document.getElementById('km_abertura').value = opt.dataset.km;
                if(e.target.value) buscarPneusDoVeiculo(e.target.value);
            });

            if (veiculoIdParam) {
                abrirModal();
                selectVeiculo.value = veiculoIdParam;
                selectVeiculo.dispatchEvent(new Event('change'));
                document.getElementById('tipo').value = 'pneu';
                document.getElementById('tipo').dispatchEvent(new Event('change'));
            }

            await buscarOS();
        }

        async function buscarOS() {
            const { data, error } = await supabaseClient
                .from('ordens_servico')
                .select(`*, veiculos (placa, modelo)`)
                .order('created_at', { ascending: false });

            if (error) return console.error(error);
            todasOS = data;
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const termo = document.getElementById('busca-os').value.toLowerCase();
            const dtInicio = document.getElementById('data-inicio').value;
            const dtFim = document.getElementById('data-fim').value;

            const filtradas = todasOS.filter(o => {
                // Filtro de Texto (OS ou Placa)
                const matchTexto = (o.os_numero && o.os_numero.toLowerCase().includes(termo)) || 
                                   (o.veiculos?.placa && o.veiculos.placa.toLowerCase().includes(termo));
                
                // Filtro de Data
                let matchData = true;
                const dataOS = new Date(o.created_at).toISOString().split('T')[0]; // Pega só YYYY-MM-DD
                if (dtInicio && dataOS < dtInicio) matchData = false;
                if (dtFim && dataOS > dtFim) matchData = false;

                return matchTexto && matchData;
            });

            calcularKPIs(filtradas);
            renderizarTabela(filtradas);
        }

        document.getElementById('busca-os').addEventListener('input', aplicarFiltros);
        document.getElementById('data-inicio').addEventListener('change', aplicarFiltros);
        document.getElementById('data-fim').addEventListener('change', aplicarFiltros);

        function calcularKPIs(lista) {
            let ativas = 0, custo = 0;
            lista.forEach(o => {
                if (o.status === 'aberta' || o.status === 'em_andamento') ativas++;
                custo += (o.custo || 0);
            });
            document.getElementById('kpi-abertas').innerText = ativas;
            document.getElementById('kpi-custo').innerText = formatarDinheiro(custo);
            document.getElementById('kpi-total').innerText = lista.length;
        }

        function renderizarTabela(lista) {
            tabela.innerHTML = '';
            if (lista.length === 0) { avisoVazio.classList.remove('hidden'); return; }
            avisoVazio.classList.add('hidden');

            lista.forEach(o => {
                let badgeClass = 'bg-blue-500/10 text-blue-500'; let statusTexto = 'Aberta';
                if (o.status === 'em_andamento') { badgeClass = 'bg-yellow-500/10 text-yellow-500'; statusTexto = 'Em Andamento'; }
                if (o.status === 'concluida') { badgeClass = 'bg-green-500/10 text-green-500'; statusTexto = 'Concluída'; }
                if (o.status === 'cancelada') { badgeClass = 'bg-red-500/10 text-red-500'; statusTexto = 'Cancelada'; }

                const data = new Date(o.created_at).toLocaleDateString('pt-BR');

                // Botões de Ação
                let botoes = '';
                if (o.status === 'aberta') {
                    botoes = `<button onclick="mudarStatus('${o.id}', 'em_andamento')" class="text-yellow-500 hover:text-yellow-600 font-medium text-xs border border-yellow-500/30 px-2 py-1 rounded">Iniciar</button>`;
                } else if (o.status === 'em_andamento') {
                    botoes = `<button onclick="concluirOS('${o.id}', '${o.tipo}')" class="text-green-500 hover:text-green-600 font-medium text-xs border border-green-500/30 px-2 py-1 rounded">Concluir</button>`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-900 dark:text-white uppercase">${o.os_numero || 'S/N'}</div>
                        <div class="text-xs text-gray-500">${data}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-bold uppercase">${o.veiculos?.placa}</div>
                        <div class="text-xs text-gray-500">${o.veiculos?.modelo}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium capitalize">${o.tipo}</div>
                        <div class="text-xs text-gray-500 truncate max-w-xs" title="${o.descricao}">${o.descricao}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs font-medium rounded-full ${badgeClass} block w-max mb-1">${statusTexto}</span>
                        <div class="text-xs font-medium text-gray-600 dark:text-gray-400">${formatarDinheiro(o.custo)}</div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        ${botoes}
                    </td>
                `;
                tabela.appendChild(tr);
            });
        }

        async function mudarStatus(id, novoStatus) {
            await supabaseClient.from('ordens_servico').update({ status: novoStatus }).eq('id', id);
            buscarOS();
        }

        async function concluirOS(id, tipo) {
            // Aqui entra a "Mágica" de dar baixa no pneu e atualizar KM
            alert("Aqui vamos implementar a lógica de finalizar a OS: dar baixa no pneu/calibragem e atualizar o KM do veículo.");
            // await supabaseClient.from('ordens_servico').update({ status: 'concluida' }).eq('id', id);
            // buscarOS();
        }

        // --- MODAL DINÂMICO ---
        const modal = document.getElementById('modal-os');
        const form = document.getElementById('form-os');
        const areaDinamica = document.getElementById('area-dinamica');
        let pneusDoVeiculoSelecionado = [];

        async function buscarPneusDoVeiculo(veiculoId) {
            const { data } = await supabaseClient.from('pneus').select('*').eq('veiculo_id', veiculoId).eq('status', 'em_uso');
            pneusDoVeiculoSelecionado = data || [];
        }

        function abrirModal() { 
            form.reset(); 
            areaDinamica.innerHTML = '';
            areaDinamica.classList.add('hidden');
            document.getElementById('div-custo').classList.add('hidden');
            modal.classList.remove('hidden'); 
        }
        function fecharModal() { modal.classList.add('hidden'); }

        // Lógica de mudar os campos conforme o tipo
        document.getElementById('tipo').addEventListener('change', async (e) => {
            const tipo = e.target.value;
            const vId = document.getElementById('veiculo_id').value;
            areaDinamica.innerHTML = '';
            
            if (!vId) {
                alert("Por favor, selecione um veículo primeiro.");
                e.target.value = '';
                return;
            }

            if (tipo === 'calibragem') {
                areaDinamica.classList.remove('hidden');
                await buscarPneusDoVeiculo(vId);
                
                let html = `<p class="text-sm font-medium mb-3">Pneus Instalados:</p>`;
                if (pneusDoVeiculoSelecionado.length === 0) html += `<p class="text-xs text-red-500">Nenhum pneu cadastrado neste veículo.</p>`;
                
                pneusDoVeiculoSelecionado.forEach(p => {
                    html += `
                        <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-2 rounded border border-gray-200 dark:border-slate-700 mb-2">
                            <div class="text-sm font-bold">${p.numero_fogo} <span class="text-xs text-gray-500 font-normal">(${p.posicao})</span></div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-500">Nova Pressão:</span>
                                <input type="number" placeholder="PSI" class="w-20 px-2 py-1 text-sm border rounded dark:bg-slate-800 dark:border-slate-600" data-pneu-id="${p.id}">
                            </div>
                        </div>
                    `;
                });
                areaDinamica.innerHTML = html;

            } else if (tipo === 'pneu') {
                areaDinamica.classList.remove('hidden');
                await buscarPneusDoVeiculo(vId);
                // Busca pneus em estoque para o select
                const { data: estoque } = await supabaseClient.from('pneus').select('id, numero_fogo, marca').eq('status', 'estoque');

                let html = `
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-medium mb-1 text-gray-500">Pneu a ser Retirado (Do Veículo)</label>
                            <select id="pneu_retirado" class="w-full text-sm px-3 py-2 border rounded-md dark:bg-slate-800 dark:border-slate-600">
                                <option value="">Nenhum / Apenas Instalar</option>
                                ${pneusDoVeiculoSelecionado.map(p => `<option value="${p.id}">${p.numero_fogo} - Posição ${p.posicao}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1 text-gray-500">Destino do Pneu Retirado</label>
                            <select id="destino_retirado" class="w-full text-sm px-3 py-2 border rounded-md dark:bg-slate-800 dark:border-slate-600">
                                <option value="estoque">Voltar para Estoque</option>
                                <option value="reforma">Enviar para Reforma</option>
                                <option value="descarte">Descartar</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1 text-gray-500">Novo Pneu a ser Instalado (Estoque)</label>
                        <select id="pneu_novo" class="w-full text-sm px-3 py-2 border rounded-md dark:bg-slate-800 dark:border-slate-600">
                            <option value="">Nenhum / Apenas Remover</option>
                            ${estoque.map(p => `<option value="${p.id}">${p.numero_fogo} - ${p.marca}</option>`).join('')}
                        </select>
                    </div>
                `;
                areaDinamica.innerHTML = html;

            } else if (tipo === 'preventiva' || tipo === 'corretiva') {
                areaDinamica.classList.remove('hidden');
                document.getElementById('div-custo').classList.remove('hidden');
                areaDinamica.innerHTML = `
                    <label class="block text-xs font-medium mb-1 text-gray-500">Descrição do Serviço</label>
                    <textarea id="desc_manutencao" rows="3" class="w-full text-sm px-3 py-2 border rounded-md dark:bg-slate-800 dark:border-slate-600"></textarea>
                `;
            } else {
                areaDinamica.classList.add('hidden');
                document.getElementById('div-custo').classList.add('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.innerHTML = 'Salvando...'; btn.disabled = true;

            const session = await supabaseClient.auth.getSession();
            const userId = session.data.session.user.id;
            const tipo = document.getElementById('tipo').value;

            let desc = '';
            if(tipo === 'calibragem') desc = 'OS de Calibragem de pneus.';
            else if(tipo === 'pneu') desc = 'OS de Troca/Reparo de pneu.';
            else desc = document.getElementById('desc_manutencao')?.value || 'Manutenção.';

            const novaOS = {
                veiculo_id: document.getElementById('veiculo_id').value,
                tipo: tipo,
                km_abertura: parseFloat(document.getElementById('km_abertura').value),
                descricao: desc,
                status: 'aberta',
                custo: userRole === 'admin' ? (parseFloat(document.getElementById('custo').value) || 0) : 0,
                aberta_por: userId
            };

            const { error } = await supabaseClient.from('ordens_servico').insert([novaOS]);

            if (error) {
                alert("Erro: " + error.message);
            } else {
                fecharModal();
                buscarOS();
            }
            btn.innerHTML = 'Criar OS'; btn.disabled = false;
        });

        carregarDados();
    </script>
</body>
</html>
