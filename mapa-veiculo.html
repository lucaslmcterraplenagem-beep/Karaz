<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa do Veículo | LK Pneus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#ea580c', darkbg: '#0f172a', darkcard: '#1e293b' }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-screen flex overflow-hidden transition-colors duration-300 antialiased">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-slate-700 transition-all duration-300 flex flex-col z-20">
        <div>
            <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">LK <span class="text-brand">Pneus</span></h1>
            </div>
            <nav class="p-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="menu-text text-sm">Dashboard</span>
                </a>
                <a href="veiculos.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand/10 text-brand rounded-md font-medium transition-colors">
                    <i data-lucide="truck" class="w-5 h-5"></i><span class="menu-text text-sm">Veículos</span>
                </a>
                <a href="pneus.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="circle-dot" class="w-5 h-5"></i><span class="menu-text text-sm">Pneus</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i><span class="menu-text text-sm">Ordens de Serviço</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-6 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <a href="veiculos.html" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors rounded-md bg-gray-100 dark:bg-slate-800">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200" id="titulo-veiculo">Carregando...</h2>
                    <p class="text-xs text-gray-500" id="subtitulo-veiculo">...</p>
                </div>
            </div>
            <div class="flex items-center gap-5">
                <button id="toggle-theme" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i><i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-darkbg flex flex-col items-center justify-start pt-12">
            
            <!-- CHASSI DO VEÍCULO -->
            <div class="relative bg-slate-300 dark:bg-slate-700 rounded-3xl p-8 shadow-xl border-4 border-slate-400 dark:border-slate-600 transition-all duration-500" id="chassi">
                
                <!-- Cabine (Frente) -->
                <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-3/4 h-20 bg-slate-400 dark:bg-slate-600 rounded-t-2xl border-4 border-b-0 border-slate-500 dark:border-slate-500 flex items-center justify-center">
                    <span class="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">Frente</span>
                </div>

                <!-- Eixos -->
                <div id="eixos-container" class="space-y-12 relative z-10 w-72">
                    <!-- Renderizado via JS -->
                </div>
            </div>

            <!-- Legenda -->
            <div class="mt-8 flex gap-6 text-sm bg-white dark:bg-darkcard px-6 py-3 rounded-full border border-gray-200 dark:border-slate-700">
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-500"></div> Bom</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-500"></div> Atenção</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-500"></div> Trocar</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full border-2 border-dashed border-gray-400"></div> Vazio (+)</div>
            </div>
        </main>
    </div>

    <!-- MODAL DE INSTALAÇÃO DE PNEU -->
    <div id="modal-instalar" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-darkcard rounded-xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-slate-700">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold">Instalar Pneu no Veículo</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-500 mb-4">Selecione um pneu do estoque para instalar neste veículo:</p>
                <div id="lista-estoque" class="space-y-2 max-h-60 overflow-y-auto pr-2">
                    <!-- Pneus em estoque listados aqui -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        lucide.createIcons();
        
        // Tema
        const html = document.documentElement;
        if (localStorage.theme === 'light') html.classList.remove('dark');
        document.getElementById('toggle-theme').addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        const urlParams = new URLSearchParams(window.location.search);
        const veiculoId = urlParams.get('id');
        let veiculoAtual = null;
        let pneusDoVeiculo = [];
        let pneuSlotSelecionado = null; // Guarda qual buraco estamos preenchendo

        async function carregarMapa() {
            if (!veiculoId) return window.location.href = "veiculos.html";

            // 1. Busca dados do veículo
            const { data: veiculo } = await supabaseClient.from('veiculos').select('*').eq('id', veiculoId).single();
            if (!veiculo) return;
            veiculoAtual = veiculo;

            document.getElementById('titulo-veiculo').innerText = `${veiculo.placa} - ${veiculo.modelo}`;
            document.getElementById('subtitulo-veiculo').innerText = `${veiculo.marca} | ${veiculo.tipo.toUpperCase()} | ${veiculo.quantidade_eixos} Eixos`;

            // 2. Busca pneus instalados neste veículo
            const { data: pneus } = await supabaseClient.from('pneus').select('*').eq('veiculo_id', veiculoId);
            pneusDoVeiculo = pneus || [];

            renderizarChassi();
        }

        function renderizarChassi() {
            const container = document.getElementById('eixos-container');
            container.innerHTML = '';

            let eixos = veiculoAtual.quantidade_eixos;
            let pneusTotal = veiculoAtual.quantidade_pneus;
            
            // Define quantos pneus por eixo (Lógica simplificada)
            let pneusPorEixo = [];
            if (veiculoAtual.tipo === 'caminhao' || veiculoAtual.tipo === 'carreta') {
                if (eixos >= 1) pneusPorEixo.push(2); // 1º Eixo
                let restantes = pneusTotal - 2;
                let eixosRestantes = eixos - 1;
                for(let i=0; i<eixosRestantes; i++) {
                    let noEixo = Math.min(4, restantes);
                    pneusPorEixo.push(noEixo);
                    restantes -= noEixo;
                }
            } else {
                let porEixo = Math.round(pneusTotal / eixos);
                for(let i=0; i<eixos; i++) pneusPorEixo.push(porEixo);
            }

            // Desenha os Eixos
            pneusPorEixo.forEach((qtd, indexEixo) => {
                const eixoDiv = document.createElement('div');
                eixoDiv.className = "relative flex justify-between items-center w-full";
                eixoDiv.innerHTML = `<div class="absolute top-1/2 left-0 w-full h-4 bg-slate-400 dark:bg-slate-600 -translate-y-1/2 rounded-full z-0"></div>`;

                let htmlPneus = '';
                for (let i = 0; i < qtd; i++) {
                    const posicao = `E${indexEixo+1}-${i+1}`; // Ex: E1-1, E2-3
                    
                    // Verifica se existe pneu nessa posição
                    const pneuAqui = pneusDoVeiculo.find(p => p.posicao === posicao);

                    if (pneuAqui) {
                        // Pneu Instalado
                        let sulco = pneuAqui.sulco_atual !== null ? pneuAqui.sulco_atual : pneuAqui.sulco_inicial;
                        let cor = 'bg-green-500 border-green-600 text-white';
                        if (sulco <= 5) cor = 'bg-yellow-500 border-yellow-600 text-white';
                        if (sulco <= 3) cor = 'bg-red-500 border-red-600 text-white';

                        htmlPneus += `
                            <div onclick="pneuOcupado('${pneuAqui.numero_fogo}')" class="relative z-10 w-12 h-16 rounded-md border-2 shadow-md cursor-pointer hover:scale-110 transition-transform ${cor} flex flex-col items-center justify-center">
                                <span class="text-[10px] font-bold leading-tight text-center break-all px-1">${pneuAqui.numero_fogo}</span>
                            </div>
                        `;
                    } else {
                        // Slot Vazio
                        htmlPneus += `
                            <div onclick="abrirModalInstalar('${posicao}')" class="relative z-10 w-12 h-16 rounded-md border-2 border-dashed border-gray-400 dark:border-gray-500 bg-gray-200/50 dark:bg-slate-800/50 shadow-inner cursor-pointer hover:bg-brand/10 hover:border-brand transition-colors flex items-center justify-center group">
                                <i data-lucide="plus" class="w-5 h-5 text-gray-400 group-hover:text-brand"></i>
                            </div>
                        `;
                    }
                }
                eixoDiv.innerHTML += `<div class="w-full flex justify-between gap-2 px-2">${htmlPneus}</div>`;
                container.appendChild(eixoDiv);
            });
            lucide.createIcons();
        }

        // --- AÇÕES ---
        
                        function pneuOcupado(numeroFogo) {
            // Cria um modal bonito no body
            const modalHtml = `
                <div id="modal-aviso-mapa" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white dark:bg-darkcard rounded-xl shadow-2xl w-full max-w-sm border border-gray-200 dark:border-slate-700 p-6 text-center">
                        <div class="w-16 h-16 bg-brand/10 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="wrench" class="w-8 h-8 text-brand"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Pneu Instalado</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
                            O pneu <strong class="text-gray-900 dark:text-white">${numeroFogo}</strong> já está neste veículo. Para removê-lo ou trocá-lo, é necessário abrir uma Ordem de Serviço (OS).
                        </p>
                        <div class="flex gap-3">
                            <button onclick="document.getElementById('modal-aviso-mapa').remove()" class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 rounded-md transition-colors">Cancelar</button>
                            <button onclick="window.location.href='ordens-servico.html?veiculo_id=${veiculoId}'" class="flex-1 px-4 py-2 text-sm font-medium text-white bg-brand hover:bg-orange-700 rounded-md transition-colors">Abrir OS</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        }

        async function abrirModalInstalar(posicao) {
            pneuSlotSelecionado = posicao;
            document.getElementById('modal-instalar').classList.remove('hidden');
            const lista = document.getElementById('lista-estoque');
            lista.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">Buscando pneus...</p>';

            // Busca pneus com status 'estoque'
            const { data: estoque } = await supabaseClient.from('pneus').select('*').eq('status', 'estoque');
            
            lista.innerHTML = '';
            if (!estoque || estoque.length === 0) {
                lista.innerHTML = '<p class="text-sm text-red-500 text-center py-4">Nenhum pneu disponível no estoque. Cadastre um novo primeiro.</p>';
                return;
            }

            estoque.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 py-3 bg-gray-50 dark:bg-slate-800 hover:bg-brand/10 border border-gray-200 dark:border-slate-700 hover:border-brand rounded-lg transition-colors flex justify-between items-center group";
                btn.onclick = () => instalarPneu(p.id, p.numero_fogo);
                btn.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-900 dark:text-white group-hover:text-brand">${p.numero_fogo}</div>
                        <div class="text-xs text-gray-500">${p.marca} ${p.medida}</div>
                    </div>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-gray-400 group-hover:text-brand"></i>
                `;
                lista.appendChild(btn);
            });
            lucide.createIcons();
        }

        function fecharModal() {
            document.getElementById('modal-instalar').classList.add('hidden');
        }

        async function instalarPneu(pneuId, numeroFogo) {
            const session = await supabaseClient.auth.getSession();
            const userId = session.data.session.user.id;

            // 1. Atualiza o pneu (Vincula ao veículo, muda status e posição)
            const { error } = await supabaseClient.from('pneus').update({
                status: 'em_uso',
                veiculo_id: veiculoId,
                posicao: pneuSlotSelecionado
            }).eq('id', pneuId);

            if (error) {
                alert("Erro ao instalar pneu: " + error.message);
                return;
            }

            // 2. Registra no Histórico do Pneu
            await supabaseClient.from('historico_pneu').insert([{
                pneu_id: pneuId,
                tipo_evento: 'instalacao',
                descricao: `Pneu instalado no veículo ${veiculoAtual.placa} na posição ${pneuSlotSelecionado}.`,
                usuario_id: userId
            }]);

            // 3. Registra no Histórico do Veículo
            await supabaseClient.from('historico_veiculo').insert([{
                veiculo_id: veiculoId,
                tipo_evento: 'movimentacao_pneu',
                descricao: `Pneu ${numeroFogo} instalado na posição ${pneuSlotSelecionado}.`,
                usuario_id: userId
            }]);

            fecharModal();
            carregarMapa(); // Recarrega o mapa para mostrar o pneu
        }

        carregarMapa();
    </script>
</body>
</html>
