<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos | LK Pneus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#ea580c', darkbg: '#0f172a', darkcard: '#1e293b' }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-screen flex overflow-hidden transition-colors duration-300 antialiased">

    <!-- SIDEBAR (Mesmo código de antes) -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-slate-700 transition-all duration-300 flex flex-col z-20">
        <div>
            <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">LK <span class="text-brand">Pneus</span></h1>
            </div>
            <nav class="p-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="menu-text text-sm">Dashboard</span>
                </a>
                <a href="veiculos.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand/10 text-brand rounded-md font-medium transition-colors">
                    <i data-lucide="truck" class="w-5 h-5"></i><span class="menu-text text-sm">Veículos</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="circle-dot" class="w-5 h-5"></i><span class="menu-text text-sm">Pneus</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i><span class="menu-text text-sm">Ordens de Serviço</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-6 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors rounded-md"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">Gestão de Veículos</h2>
            </div>
            <div class="flex items-center gap-5">
                <button id="toggle-theme" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i><i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
                <div class="h-5 w-px bg-gray-300 dark:bg-slate-700"></div>
                <div class="flex items-center gap-3">
                    <p id="user-email" class="text-sm font-medium text-gray-800 dark:text-gray-200 hidden sm:block">...</p>
                    <button id="btn-logout" class="p-2 text-gray-400 hover:text-red-500 transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-darkbg">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <div class="relative w-full sm:w-96">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="input-busca" placeholder="Buscar por placa ou modelo..." class="w-full pl-10 pr-4 py-2 bg-white dark:bg-darkcard border border-gray-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:border-brand transition-colors">
                </div>
                <button onclick="abrirModal()" class="w-full sm:w-auto bg-brand hover:bg-orange-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo Veículo
                </button>
            </div>

            <!-- Tabela -->
            <div class="bg-white dark:bg-darkcard border border-gray-200 dark:border-slate-700 rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-slate-800/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Placa / Prefixo</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Modelo</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Eixos / Pneus</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">KM / Horas</th>
                            <th class="px-6 py-3 font-medium border-b border-gray-200 dark:border-slate-700">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-veiculos" class="text-sm divide-y divide-gray-200 dark:divide-slate-700"></tbody>
                </table>
                <div id="aviso-vazio" class="p-8 text-center text-gray-500 dark:text-gray-400 text-sm hidden">Nenhum veículo cadastrado ainda.</div>
            </div>
        </main>
    </div>

    <!-- MODAL DE CADASTRO EM 2 ABAS -->
    <div id="modal-veiculo" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-darkcard rounded-xl shadow-2xl w-full max-w-2xl border border-gray-200 dark:border-slate-700 overflow-hidden">
            
            <!-- Cabeçalho do Modal com Abas -->
            <div class="px-6 pt-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center">
                <div class="flex gap-6">
                    <button type="button" id="tab-btn-1" class="pb-3 text-brand border-b-2 border-brand font-medium text-sm transition-colors">1. Dados Básicos</button>
                    <button type="button" id="tab-btn-2" class="pb-3 text-gray-400 border-b-2 border-transparent font-medium text-sm transition-colors cursor-not-allowed" disabled>2. Configuração de Pneus</button>
                </div>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500 transition-colors pb-3"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="form-veiculo">
                <!-- ABA 1: DADOS BÁSICOS -->
                <div id="tab-content-1" class="p-6 space-y-4">
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Placa (Única)</label>
                            <input type="text" id="placa" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand uppercase">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Prefixo</label>
                            <input type="text" id="prefixo" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Chassi</label>
                            <input type="text" id="chassi" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand uppercase">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Modelo</label>
                            <input type="text" id="modelo" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Marca</label>
                            <input type="text" id="marca" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Ano</label>
                            <input type="number" id="ano" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Tipo de Veículo</label>
                            <select id="tipo" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand text-sm">
                                <option value="caminhao">Caminhão</option>
                                <option value="carreta">Carreta</option>
                                <option value="maquina">Máquina</option>
                                <option value="utilitario">Utilitário</option>
                            </select>
                        </div>
                    </div>
                    <div class="pt-4 flex justify-end gap-3 border-t border-gray-200 dark:border-slate-700 mt-2">
                        <button type="button" onclick="fecharModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-md transition-colors">Cancelar</button>
                        <button type="button" onclick="irParaAba2()" class="px-4 py-2 text-sm font-medium text-white bg-brand hover:bg-orange-700 rounded-md transition-colors">Próximo Passo →</button>
                    </div>
                </div>

                <!-- ABA 2: CONFIGURAÇÃO DE PNEUS -->
                <div id="tab-content-2" class="p-6 space-y-4 hidden">
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Quantidade de Eixos</label>
                            <input type="number" id="eixos" required min="2" value="2" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Quantidade de Pneus</label>
                            <input type="number" id="qtd_pneus" required min="4" value="6" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Estepes</label>
                            <input type="number" id="estepes" required min="0" value="0" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">KM Atual</label>
                            <input type="number" id="km" required class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Horas Atual (Máquinas)</label>
                            <input type="number" id="horas" value="0" class="w-full px-3 py-2 bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-md focus:outline-none focus:border-brand">
                        </div>
                    </div>

                    <div id="erro-modal" class="hidden text-red-500 text-sm bg-red-500/10 p-3 rounded-md"></div>

                    <div class="pt-4 flex justify-between border-t border-gray-200 dark:border-slate-700 mt-2">
                        <button type="button" onclick="voltarParaAba1()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-md transition-colors">← Voltar</button>
                        <button type="submit" id="btn-salvar" class="px-4 py-2 text-sm font-medium text-white bg-brand hover:bg-orange-700 rounded-md transition-colors">Finalizar Cadastro</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/supabase-client.js"></script>
    <script>
        lucide.createIcons();

        // --- PROTEÇÃO DE ROTA ---
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) { window.location.href = "login.html"; } 
            else { document.getElementById('user-email').innerText = session.user.email; }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        });

        // --- UI LÓGICA ---
        const sidebar = document.getElementById('sidebar');
        const menuTexts = document.querySelectorAll('.menu-text');
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-20');
                menuTexts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.replace('w-20', 'w-64');
                menuTexts.forEach(el => el.classList.remove('hidden'));
            }
        });

        const html = document.documentElement;
        if (localStorage.theme === 'light') html.classList.remove('dark');
        document.getElementById('toggle-theme').addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- LÓGICA DE ABAS DO MODAL ---
        const tab1 = document.getElementById('tab-content-1');
        const tab2 = document.getElementById('tab-content-2');
        const btnTab1 = document.getElementById('tab-btn-1');
        const btnTab2 = document.getElementById('tab-btn-2');

        function irParaAba2() {
            // Validação básica HTML5 para os campos obrigatórios da aba 1
            const placa = document.getElementById('placa');
            const modelo = document.getElementById('modelo');
            const marca = document.getElementById('marca');
            const ano = document.getElementById('ano');

            if (!placa.reportValidity() || !modelo.reportValidity() || !marca.reportValidity() || !ano.reportValidity()) return;

            tab1.classList.add('hidden');
            tab2.classList.remove('hidden');
            
            // Muda estilo das abas
            btnTab1.classList.remove('text-brand', 'border-brand');
            btnTab1.classList.add('text-gray-400', 'border-transparent');
            btnTab2.classList.remove('text-gray-400', 'border-transparent', 'cursor-not-allowed');
            btnTab2.classList.add('text-brand', 'border-brand');
        }

        function voltarParaAba1() {
            tab2.classList.add('hidden');
            tab1.classList.remove('hidden');
            
            btnTab2.classList.remove('text-brand', 'border-brand');
            btnTab2.classList.add('text-gray-400', 'border-transparent', 'cursor-not-allowed');
            btnTab1.classList.remove('text-gray-400', 'border-transparent');
            btnTab1.classList.add('text-brand', 'border-brand');
        }

        // --- LÓGICA DO BANCO DE DADOS ---
        const tabela = document.getElementById('tabela-veiculos');
        const avisoVazio = document.getElementById('aviso-vazio');
        let todosVeiculos = [];

        async function carregarVeiculos() {
            const { data, error } = await supabaseClient.from('veiculos').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            todosVeiculos = data;
            renderizarTabela(data);
        }

        function renderizarTabela(lista) {
            tabela.innerHTML = '';
            if (lista.length === 0) {
                avisoVazio.classList.remove('hidden');
                return;
            }
            avisoVazio.classList.add('hidden');

            lista.forEach(v => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-900 dark:text-white uppercase">${v.placa}</div>
                        <div class="text-xs text-gray-500">${v.prefixo || 'S/ Prefixo'}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-800 dark:text-gray-200">${v.modelo}</div>
                        <div class="text-xs text-gray-500">${v.marca} - ${v.ano}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-sm">${v.quantidade_eixos} Eixos</div>
                        <div class="text-xs text-gray-500">${v.quantidade_pneus} Pneus (+${v.quantidade_estepes} estepes)</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-sm">${v.km_atual} km</div>
                        <div class="text-xs text-gray-500">${v.horas_atual} h</div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-gray-400 hover:text-brand transition-colors" title="Ver Mapa do Veículo">
                            <i data-lucide="map" class="w-5 h-5"></i>
                        </button>
                    </td>
                `;
                tabela.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Busca rápida
        document.getElementById('input-busca').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = todosVeiculos.filter(v => 
                v.placa.toLowerCase().includes(termo) || 
                v.modelo.toLowerCase().includes(termo) ||
                (v.prefixo && v.prefixo.toLowerCase().includes(termo))
            );
            renderizarTabela(filtrados);
        });

        // Modal
        const modal = document.getElementById('modal-veiculo');
        const form = document.getElementById('form-veiculo');
        
        function abrirModal() { 
            document.getElementById('erro-modal').classList.add('hidden');
            form.reset();
            voltarParaAba1(); // Sempre volta pra aba 1
            modal.classList.remove('hidden'); 
        }
        function fecharModal() { modal.classList.add('hidden'); }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            const erroDiv = document.getElementById('erro-modal');
            
            btn.innerHTML = 'Salvando...';
            btn.disabled = true;
            erroDiv.classList.add('hidden');

            const novoVeiculo = {
                placa: document.getElementById('placa').value.toUpperCase(),
                prefixo: document.getElementById('prefixo').value,
                chassi: document.getElementById('chassi').value || null,
                modelo: document.getElementById('modelo').value,
                marca: document.getElementById('marca').value,
                ano: parseInt(document.getElementById('ano').value),
                tipo: document.getElementById('tipo').value,
                quantidade_eixos: parseInt(document.getElementById('eixos').value),
                quantidade_pneus: parseInt(document.getElementById('qtd_pneus').value),
                quantidade_estepes: parseInt(document.getElementById('estepes').value),
                km_atual: parseFloat(document.getElementById('km').value),
                horas_atual: parseFloat(document.getElementById('horas').value)
            };

            const { data, error } = await supabaseClient.from('veiculos').insert([novoVeiculo]).select();

                        if (error) {
                let mensagemErro = error.message;
                
                // Traduzindo os erros do banco para português
                if (mensagemErro.includes("veiculos_placa_key")) {
                    mensagemErro = "Erro: Esta Placa já está cadastrada em outro veículo.";
                } else if (mensagemErro.includes("veiculos_chassi_key")) {
                    mensagemErro = "Erro: Este Chassi já está cadastrado em outro veículo.";
                } else if (mensagemErro.includes("row-level security policy")) {
                    mensagemErro = "Acesso negado: Você não tem permissão de Administrador.";
                } else if (mensagemErro.includes("null value in column")) {
                    mensagemErro = "Erro: Algum campo obrigatório ficou em branco.";
                }

                erroDiv.innerText = mensagemErro;
                erroDiv.classList.remove('hidden');
                btn.innerHTML = 'Finalizar Cadastro';
                btn.disabled = false;
            } else {
                // REGISTRAR NO HISTÓRICO AUTOMATICAMENTE
                await supabaseClient.from('historico_veiculo').insert([{
                    veiculo_id: data[0].id,
                    tipo_evento: 'outros',
                    descricao: 'Cadastro inicial do veículo no sistema.',
                    km_registro: novoVeiculo.km_atual
                }]);

                fecharModal();
                carregarVeiculos();
                btn.innerHTML = 'Finalizar Cadastro';
                btn.disabled = false;
            }
        });

        carregarVeiculos();
    </script>
</body>
</html>
