<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Karaz Sistema</title>
        <script>
        // Evita o flash de tema na troca de páginas
        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Fonte Formal: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#ea580c', darkbg: '#0f172a', darkcard: '#1e293b' }
                }
            }
        }
    </script>
    <!-- Ícones (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-screen flex overflow-hidden transition-colors duration-300 antialiased">

    <!-- SIDEBAR RETRÁTIL -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-slate-700 transition-all duration-300 flex flex-col justify-between z-20">
        <div>
            <!-- Logo -->
            <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">Karaz <span class="text-brand">Sistema</span></h1>
            </div>
            
            <!-- Menu -->
            <nav class="p-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand/10 text-brand rounded-md font-medium transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="menu-text text-sm">Dashboard</span>
                </a>
                <a href="veiculos.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="truck" class="w-5 h-5"></i>
                    <span class="menu-text text-sm">Veículos</span>
                </a>
                <a href="pneus.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="disc" class="w-5 h-5"></i>
                    <span class="menu-text text-sm">Pneus</span>
                </a>
                <a href="ordens-servico.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                    <span class="menu-text text-sm">Ordens de Serviço</span>
                </a>
                                <!-- Menu Ativo -->
                <a href="cadastros.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700/50 hover:text-gray-900 dark:hover:text-white rounded-md font-medium transition-colors">
                    <i data-lucide="database" class="w-5 h-5"></i><span class="menu-text text-sm">Cadastros Gerais</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-6 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors rounded-md">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">Visão Geral</h2>
            </div>

            <div class="flex items-center gap-5">
                <!-- Botão Modo Dia/Noite -->
                <button id="toggle-theme" class="p-1.5 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors" title="Alternar Tema">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
                
                <div class="h-5 w-px bg-gray-300 dark:bg-slate-700"></div>

                <!-- Perfil e Sair -->
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p id="user-email" class="text-sm font-medium text-gray-800 dark:text-gray-200">carregando...</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Administrador</p>
                    </div>
                    <button id="btn-logout" class="p-2 text-gray-400 hover:text-red-500 transition-colors" title="Sair do sistema">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- ÁREA DOS CARDS -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-darkbg">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- Card 1: Veículos -->
                <div class="bg-white dark:bg-darkcard p-5 rounded-lg border border-gray-200 dark:border-slate-700 flex items-start justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Veículos Ativos</p>
                        <p id="kpi-veiculos" class="text-2xl font-bold mt-2 text-gray-900 dark:text-white">0</p>
                    </div>
                    <i data-lucide="truck" class="w-5 h-5 text-gray-400 dark:text-gray-500"></i>
                </div>

                <!-- Card 2: Total de Pneus -->
                <div class="bg-white dark:bg-darkcard p-5 rounded-lg border border-gray-200 dark:border-slate-700 flex items-start justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Pneus</p>
                        <p id="kpi-pneus" class="text-2xl font-bold mt-2 text-gray-900 dark:text-white">0</p>
                    </div>
                    <i data-lucide="disc" class="w-5 h-5 text-gray-400 dark:text-gray-500"></i>
                </div>

                <!-- Card 3: OS Abertas -->
                <div class="bg-white dark:bg-darkcard p-5 rounded-lg border border-gray-200 dark:border-slate-700 flex items-start justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">OS Abertas</p>
                        <p id="kpi-os" class="text-2xl font-bold mt-2 text-gray-900 dark:text-white">0</p>
                    </div>
                    <i data-lucide="wrench" class="w-5 h-5 text-gray-400 dark:text-gray-500"></i>
                </div>

                <!-- Card 4: % Vida da Frota -->
                <div class="bg-white dark:bg-darkcard p-5 rounded-lg border border-gray-200 dark:border-slate-700 flex items-start justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Vida da Frota</p>
                        <p id="kpi-vida" class="text-2xl font-bold mt-2 text-gray-900 dark:text-white">0%</p>
                    </div>
                    <i data-lucide="activity" class="w-5 h-5 text-gray-400 dark:text-gray-500"></i>
                </div>

            </div>
            
            <div class="mt-6 bg-white dark:bg-darkcard rounded-lg border border-gray-200 dark:border-slate-700 h-80 flex items-center justify-center text-sm text-gray-400 transition-colors">
                Área reservada para Gráficos (Fase Futura)
            </div>
        </main>
    </div>

    <!-- SCRIPT DE INICIALIZAÇÃO E LÓGICA DE UI -->
    <script src="js/supabase-client.js"></script>
    <script>
        lucide.createIcons();

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) {
                window.location.href = "login.html";
            } else {
                document.getElementById('user-email').innerText = session.user.email;
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        });

        const sidebar = document.getElementById('sidebar');
        const menuTexts = document.querySelectorAll('.menu-text');
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-20');
                menuTexts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.replace('w-20', 'w-64');
                menuTexts.forEach(el => el.classList.remove('hidden'));
            }
        });

        const html = document.documentElement;
        const themeBtn = document.getElementById('toggle-theme');
        
        if (localStorage.theme === 'light') {
            html.classList.remove('dark');
        }

        themeBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // --- LÓGICA DE DADOS REAIS ---
        async function carregarDashboard() {
            // 1. Contar Veículos Ativos
            const { count: countVeiculos } = await supabaseClient
                .from('veiculos')
                .select('*', { count: 'exact', head: true })
                .eq('ativo', true);
            
            document.getElementById('kpi-veiculos').innerText = countVeiculos || 0;

            // 2. Contar Total de Pneus
            const { count: countPneus } = await supabaseClient
                .from('pneus')
                .select('*', { count: 'exact', head: true });
            
            document.getElementById('kpi-pneus').innerText = countPneus || 0;

            // 3. Contar OS Abertas (ou em andamento)
            const { count: countOS } = await supabaseClient
                .from('ordens_servico')
                .select('*', { count: 'exact', head: true })
                .in('status', ['aberta', 'em_andamento']);
            
            document.getElementById('kpi-os').innerText = countOS || 0;

            // 4. Calcular Vida da Frota (Média de sulco dos pneus em uso)
            const { data: pneusEmUso } = await supabaseClient
                .from('pneus')
                .select('sulco_atual, sulco_inicial')
                .eq('status', 'em_uso');

            if (pneusEmUso && pneusEmUso.length > 0) {
                let somaPorcentagem = 0;
                let pneusValidos = 0;

                pneusEmUso.forEach(p => {
                    if (p.sulco_atual !== null && p.sulco_inicial > 0) {
                        // Calcula a % de vida: (Atual / Inicial) * 100
                        let vida = (p.sulco_atual / p.sulco_inicial) * 100;
                        // Arredonda para não ter números quebrados
                        somaPorcentagem += Math.min(100, Math.max(0, vida));
                        pneusValidos++;
                    }
                });

                if (pneusValidos > 0) {
                    let mediaVida = Math.round(somaPorcentagem / pneusValidos);
                    document.getElementById('kpi-vida').innerText = mediaVida + '%';
                    
                    // Muda a cor se a frota estiver crítica
                    if (mediaVida <= 30) document.getElementById('kpi-vida').classList.add('text-red-500');
                    else if (mediaVida <= 50) document.getElementById('kpi-vida').classList.add('text-yellow-500');
                    else document.getElementById('kpi-vida').classList.add('text-green-500');
                } else {
                    document.getElementById('kpi-vida').innerText = '0%';
                }
            } else {
                document.getElementById('kpi-vida').innerText = '0%';
            }
        }

        // Inicia a busca de dados
        carregarDashboard();
    </script>
</body>
</html>
