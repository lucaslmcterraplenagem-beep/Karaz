<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | LK Pneus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuração do Tailwind para Dark Mode manual
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#ea580c', // Laranja LK
                        darkbg: '#111827', // Fundo escuro
                        darkcard: '#1f2937' // Card escuro
                    }
                }
            }
        }
    </script>
    <!-- Ícones (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans h-screen flex overflow-hidden transition-colors duration-300">

    <!-- SIDEBAR RETRÁTIL -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-gray-800 transition-all duration-300 flex flex-col justify-between z-20">
        <div>
            <!-- Logo -->
            <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-gray-800">
                <h1 class="text-2xl font-bold text-brand">LK <span class="text-gray-800 dark:text-white">Pneus</span></h1>
            </div>
            
            <!-- Menu -->
            <nav class="p-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand/10 text-brand rounded-lg font-medium transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="menu-text">Dashboard</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-brand dark:hover:text-brand rounded-lg font-medium transition-colors">
                    <i data-lucide="truck" class="w-5 h-5"></i>
                    <span class="menu-text">Veículos</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-brand dark:hover:text-brand rounded-lg font-medium transition-colors">
                    <i data-lucide="circle-dot" class="w-5 h-5"></i>
                    <span class="menu-text">Pneus</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-brand dark:hover:text-brand rounded-lg font-medium transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                    <span class="menu-text">Ordens de Serviço</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 transition-colors duration-300">
            <!-- Botão Retrátil e Título -->
            <div class="flex items-center gap-4">
                <button id="toggle-sidebar" class="p-2 text-gray-500 hover:text-brand transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <h2 class="text-lg font-semibold">Visão Geral</h2>
            </div>

            <!-- Ações do Usuário -->
            <div class="flex items-center gap-4">
                <!-- Botão Modo Dia/Noite -->
                <button id="toggle-theme" class="p-2 text-gray-500 hover:text-brand transition-colors" title="Alternar Tema">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
                
                <div class="h-6 w-px bg-gray-300 dark:bg-gray-700"></div>

                <!-- Perfil e Sair -->
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p id="user-email" class="text-sm font-medium text-gray-800 dark:text-white">carregando...</p>
                        <p class="text-xs text-gray-500">Admin</p>
                    </div>
                    <button id="btn-logout" class="p-2 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-lg transition-colors" title="Sair">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- ÁREA DOS CARDS -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                <!-- Card 1: Veículos -->
                <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 flex items-center justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Veículos Ativos</p>
                        <p class="text-3xl font-bold mt-2 text-gray-800 dark:text-white">12</p>
                    </div>
                    <div class="p-3 bg-blue-500/10 text-blue-500 rounded-full">
                        <i data-lucide="truck" class="w-8 h-8"></i>
                    </div>
                </div>

                <!-- Card 2: Total de Pneus -->
                <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 flex items-center justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Pneus</p>
                        <p class="text-3xl font-bold mt-2 text-gray-800 dark:text-white">145</p>
                    </div>
                    <div class="p-3 bg-brand/10 text-brand rounded-full">
                        <i data-lucide="circle-dot" class="w-8 h-8"></i>
                    </div>
                </div>

                <!-- Card 3: OS Abertas -->
                <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 flex items-center justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">OS Abertas</p>
                        <p class="text-3xl font-bold mt-2 text-gray-800 dark:text-white">3</p>
                    </div>
                    <div class="p-3 bg-yellow-500/10 text-yellow-500 rounded-full">
                        <i data-lucide="wrench" class="w-8 h-8"></i>
                    </div>
                </div>

                <!-- Card 4: % Vida da Frota -->
                <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 flex items-center justify-between transition-colors">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Vida da Frota</p>
                        <p class="text-3xl font-bold mt-2 text-green-500">78%</p>
                    </div>
                    <div class="p-3 bg-green-500/10 text-green-500 rounded-full">
                        <i data-lucide="activity" class="w-8 h-8"></i>
                    </div>
                </div>

            </div>
            
            <div class="mt-8 bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 h-96 flex items-center justify-center text-gray-400 transition-colors">
                <!-- Espaço reservado para gráficos futuros -->
                Área reservada para Gráficos (Fase Futura)
            </div>
        </main>
    </div>

    <!-- SCRIPT DE INICIALIZAÇÃO E LÓGICA DE UI -->
    <script src="js/supabase-client.js"></script>
    <script>
        // Inicializa os ícones
        lucide.createIcons();

        // --- Lógica de Proteção de Rota e Email do Usuário ---
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) {
                window.location.href = "login.html"; // Chuta de volta pro login se não estiver logado
            } else {
                document.getElementById('user-email').innerText = session.user.email;
            }
        });

        // --- Botão de Logout ---
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        });

        // --- Lógica do Menu Retrátil ---
        const sidebar = document.getElementById('sidebar');
        const menuTexts = document.querySelectorAll('.menu-text');
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-20');
                menuTexts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.replace('w-20', 'w-64');
                menuTexts.forEach(el => el.classList.remove('hidden'));
            }
        });

        // --- Lógica do Modo Dia/Noite ---
        const html = document.documentElement;
        const themeBtn = document.getElementById('toggle-theme');
        
        // Verifica se o usuário já tinha escolhido um tema antes
        if (localStorage.theme === 'light') {
            html.classList.remove('dark');
        }

        themeBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });
    </script>
</body>
</html>
